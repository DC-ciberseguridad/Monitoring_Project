name: Deploy Monitoring Stack

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --- FASE 1: Crear solo el ECR ---
      - name: Terraform Init & ECR Target
        working-directory: ./iac
        run: |
          terraform init
          terraform apply -target=aws_ecr_repository.monitoring_api -auto-approve

      # --- FASE 2: Build & Push de la Imagen ---
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        run: |
          # Obtenemos la URL del ECR que acabamos de asegurar que existe
          ECR_REPO=$(aws ecr describe-repositories --repository-names monitoring-lambda-api --query 'repositories[0].repositoryUri' --output text)
          docker build -t $ECR_REPO:latest ./api
          docker push $ECR_REPO:latest
          echo "ECR_REPO=$ECR_REPO" >> $GITHUB_ENV

      # --- FASE 3: Terraform Apply Completo ---
      - name: Terraform Apply Full
        working-directory: ./iac
        run: terraform apply -auto-approve

      # --- FASE 4: Refrescar Lambda (Opcional pero recomendado) ---
      - name: Update Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name monitoring-event-processor \
            --image-uri ${{ env.ECR_REPO }}:latest || echo "Lambda no creada aún, saltando update manual."